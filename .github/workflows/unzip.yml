name: Unzip KX Studio

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "اسم ملف ZIP في جذر المستودع"
        required: true
        default: "KX_Studio_v0_2-dev_ARMv7.zip"
      delete_zip:
        description: "حذف ملف ZIP بعد الفك؟"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # إذا أضفت سر PAT_TOKEN (صلاحية repo + workflow) سيتمكن من دفع ملفات .github/workflows أيضاً
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Unzip
        run: |
          set -e
          ZIP="${{ github.event.inputs.zip_file }}"
          test -f "$ZIP" || { echo "الملف $ZIP غير موجود"; exit 1; }

          rm -rf /tmp/kx_extract && mkdir /tmp/kx_extract
          unzip -q "$ZIP" -d /tmp/kx_extract

          # إذا كان كل المحتوى داخل مجلد واحد، انقل محتواه إلى الجذر
          SRC=/tmp/kx_extract
          if [ "$(ls -A "$SRC" | wc -l)" = "1" ] && [ -d "$SRC/$(ls -A "$SRC")" ]; then
            SRC="$SRC/$(ls -A "$SRC")"
          fi

          # GITHUB_TOKEN لا يستطيع دفع ملفات workflows، فنتخطاها إلا إذا وُجد PAT_TOKEN
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "PAT_TOKEN غير موجود: سيتم تخطي .github/workflows"
            rm -rf "$SRC/.github/workflows"
          fi

          cp -a "$SRC"/. .

          if [ "${{ github.event.inputs.delete_zip }}" = "true" ]; then
            rm -f "$ZIP"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "لا توجد تغييرات"; exit 0; }
          git commit -m "Unzip KX Studio"
          git push
