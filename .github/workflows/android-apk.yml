name: Build KX Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, development/armv7-native-foundation ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build ARMv7 debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify ARMv7 native library is packaged
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$APK" | grep -Fx "lib/armeabi-v7a/libkxstudio.so"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KX-Studio-ARMv7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
